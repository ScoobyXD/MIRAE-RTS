# fly.toml - Fly.io deployment config

app = "globalrts"
primary_region = "lax"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500
	
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
