#
# GlobalRTS Tracker - Configuration (Simplified for NCS v3.2.1)
# nRF9151 firmware for cellular IoT tracking with GlobalRTS integration
#

# ============================================
# General
# ============================================
CONFIG_FPU=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# ============================================
# Modem and LTE
# ============================================
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y

# Network mode: LTE-M with GPS
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y

# PSM (Power Saving Mode) - allows GNSS to run while LTE is idle
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00101000"
CONFIG_LTE_PSM_REQ_RAT="00000011"

# ============================================
# Networking (Modem offloaded)
# ============================================
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE=n

# ============================================
# AT Host (allows serial AT commands for debugging)
# ============================================
CONFIG_AT_HOST_LIBRARY=y

# ============================================
# Date/Time
# ============================================
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_MODEM=y

# ============================================
# JSON Parsing
# ============================================
CONFIG_CJSON_LIB=y

# ============================================
# Memory Configuration
# ============================================
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
